[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pnf"
version = "0.1.0"
description = "Pure-Python decoder for Shearwater's Petrel Native Format (PNF) dive logs"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Snehan Kekre" }]
keywords = ["diving", "scuba", "shearwater", "petrel", "dive-computer", "pnf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/snehankekre/pnf"
Specification = "https://github.com/snehankekre/pnf/blob/main/SPEC.md"
Issues = "https://github.com/snehankekre/pnf/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
